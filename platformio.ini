; Hodiny / stopky / minutka pro LAFVIN ESP32-C6 s 1,47" displejem (ST7789, 172x320)

[platformio]
; build a knihovny mimo OneDrive, jinak by se synchronizovaly tisice docasnych souboru
workspace_dir = ${sysenv.USERPROFILE}/.pio-work/hodiny
; vlastni slozka s platformou a toolchainem: pioarduino by jinak v globalnim ~/.platformio
; prepsalo balicky oficialni platformy espressif32, kterou pouzivaji ostatni projekty
core_dir = ${sysenv.USERPROFILE}/.pio-work/hodiny-core

[env:esp32c6]
; oficialni platforma PlatformIO neumi Arduino na ESP32-C6, proto komunitni pioarduino
; (pripnuta verze: novejsi vydani vyzaduji PlatformIO Core >= 6.2.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
upload_port = COM13
monitor_port = COM13
monitor_speed = 115200
